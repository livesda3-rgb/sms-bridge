plugins { id 'com.android.application' }
android {
    namespace 'dev.kats.smsbridge'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.kats.smsbridge'
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName '0.4-qr'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Align stdlib and legacy jdk7/jdk8 artifacts pulled in by AndroidX.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // ZXing 4.3.0's published POM omits its AndroidX implementation dependencies.
    // These must be packaged at runtime, not only available to the compiler.
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.fragment:fragment:1.6.2'
}
